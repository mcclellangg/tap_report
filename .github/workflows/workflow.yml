name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install project dependencies
        run: uv sync --locked

      - name: Build static site
        run: uv run freeze.py

      - name: Test static assets
        id: asset_test
        continue-on-error: true
        run: uv run pytest tests/test_assets.py tests/test_build_assets.py

      - name: Log asset test failure
        if: steps.asset_test.outcome == 'failure'
        run: echo "::error title=Static asset tests failed::One or more static asset tests failed (see the 'Test static assets' step for details). Deploying anyway."

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

